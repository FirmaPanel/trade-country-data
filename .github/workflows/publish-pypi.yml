name: Publish PyPI package

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Prepare and test package
        working-directory: packages/pypi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/build_package.py
          python scripts/build_package.py --check
          python scripts/check_version.py "$RELEASE_TAG"
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build and inspect distributions
        working-directory: packages/pypi
        run: |
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: packages/pypi/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/firmapanel-trade-country-data
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: pypi-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: PyPI package

on:
  push:
    paths:
      - ".github/workflows/pypi.yml"
      - "packages/pypi/**"
      - "data/**"
      - "schema/**"
      - "ATTRIBUTION.md"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/pypi.yml"
      - "packages/pypi/**"
      - "data/**"
      - "schema/**"
      - "ATTRIBUTION.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"

    defaults:
      run:
        working-directory: packages/pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Prepare package data
        run: python scripts/build_package.py

      - name: Check package
        run: |
          python scripts/build_package.py --check
          python scripts/check_version.py
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build

      - name: Inspect distributions
        run: python -m twine check dist/*

      - name: Install and import wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import firmapanel_trade_country_data as d; assert d.load_dataset('countries')['record_count'] == 249"
